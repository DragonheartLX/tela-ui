[package]
name = "tela-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "tela_lib"

[[bin]]
path = "src/main.rs"
name = "tela"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "accessibility",
    "compat-1-18",
    "backend-winit",
    "renderer-skia",
    "renderer-software",
    "std",
] }

[build-dependencies]
slint-build = "1.18.1"

[profile.dev]
lto = false
# `line-tables-only` keeps file:line in backtraces.
# It costs a fraction of what full debug info adds to every rebuild.
debug = "line-tables-only"
opt-level = 0
incremental = true

# The app itself stays unoptimized for fast iteration; the UI toolkit's
# rendering/layout/text paths must run optimized, or every page mount and
# frame stutters (~85ms vs ~5ms for the gallery page mount).
[profile.dev.package."*"]
opt-level = 2
# Dependencies are not the code a backtrace is read for.
debug = false

[profile.release]
# `incremental` stays out: release builds are one-off artifacts, not an
# edit/build loop.
codegen-units = 16
lto = true
opt-level = "s"
# Overflow checks stay on, so an arithmetic bug aborts instead of wrapping
# silently. `src/fatal.rs` reports that abort through a native dialog: the
# release binary has no console (`windows_subsystem = "windows"` in
# `src/main.rs`).
panic = "abort"
strip = true
debug = false
overflow-checks = true
